name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stamp build tag into the page
        run: |
          STAMP="build $(date -u '+%Y-%m-%d %H:%M UTC') sha=${{ github.sha }}"
          sed -i "s|</body>|<script>if(location.hostname.endsWith('github.io')\&\&location.pathname!='/Dead-Storm/'\&\&location.pathname.toLowerCase()==='/dead-storm/')location.replace('/Dead-Storm/');</script><div id='buildstamp' style='position:fixed;bottom:2px;right:6px;z-index:99999;font-family:monospace;font-size:10px;color:#22c55e;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px'>$STAMP</div></body>|" index.html
          echo "stamped: $STAMP"

      - name: Prevent Jekyll processing
        run: touch dist/.nojekyll

      - name: Copy runtime data assets
        run: cp -r data dist/data

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
